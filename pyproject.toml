[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "embodied-ai-obstacle-avoidance"
version = "1.0.0"
description = "A Chinese beginner-friendly embodied AI robot navigation demo"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "matplotlib>=3.7", "pillow>=9.5"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
